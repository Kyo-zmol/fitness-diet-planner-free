name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile scripts/plan_calculator.py scripts/selftest.py
      - name: Run self-tests
        run: python scripts/selftest.py
      - name: Smoke-test generate
        run: |
          python scripts/plan_calculator.py template > /tmp/profile.json
          python - <<'EOF'
          import json
          p = json.load(open("/tmp/profile.json"))
          p.update({"name":"CI","sex":"male","age":30,"height_cm":175,"weight_kg":80,
                    "activity_level":"light","goal":"cut","goal_intensity":"standard",
                    "training_days":4,"experience":"intermediate",
                    "equipment":["dumbbell","bench"],"diet":"omnivore","meals_per_day":3})
          json.dump(p, open("/tmp/profile.json","w"), ensure_ascii=False)
          EOF
          python scripts/plan_calculator.py generate --profile /tmp/profile.json --out-plan /tmp/plan.json --out-md /tmp/plan.md
          test -s /tmp/plan.md && echo "plan.md generated"
      - name: Smoke-test check-in CLI
        run: |
          # Two saved reviews, both expected to change nothing: this is the path
          # that used to drop the data point and dilute the next window.
          W1=$(date -d '+2 weeks' +%F); W2=$(date -d '+3 weeks' +%F)
          python scripts/plan_calculator.py checkin --plan /tmp/plan.json --weight 78.9 --adherence 90 --as-of "$W1" --save > /tmp/c1.md
          python scripts/plan_calculator.py checkin --plan /tmp/plan.json --weight 78.5 --adherence 88 --as-of "$W2" --save > /tmp/c2.md
          test -s /tmp/c2.md && echo "checkin.md rendered"
          python - <<'EOF'
          import json
          d = json.load(open("/tmp/plan.json"))
          h = d["checkin_history"]
          assert len(h) == 2, h
          assert h[1]["date"] > h[0]["date"], h
          li = d["last_checkin"]
          assert li["weeks_elapsed"] == 1.0, li
          assert li["baseline_date"] == h[0]["date"], li
          print("check-in baseline advanced correctly")
          EOF
          # a malformed review date must fail with a readable line, not a traceback
          if python scripts/plan_calculator.py checkin --plan /tmp/plan.json --weight 78 --as-of 09/10/2026 2>/tmp/err.txt; then
            echo "expected a rejection of --as-of 09/10/2026" && exit 1
          fi
          grep -q 'YYYY-MM-DD' /tmp/err.txt && echo "date validation message ok"
